name: Blitz
options:
  bundleIdPrefix: de.fa-krug.blitz
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Stable self-signed identity so macOS keeps the Accessibility grant across rebuilds.
    # Create it once — see docs/signing.md.
    CODE_SIGN_IDENTITY: "Blitz Self-Signed"
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Blitz:
    type: application
    platform: macOS
    sources:
      - path: Blitz
        # The helper's own sources: compiling them in would link Vision and PDFKit into the app,
        # which is the whole thing running recognition out of process avoids.
        excludes:
          - Features/Clipboard/Service/ClipboardTextExtractor.swift
          - Features/Clipboard/Service/ClipboardTextHelper.swift
          - Resources/EmojiKeywords
      # A folder reference keeps the packs in their own directory, which `EmojiIndex` lists.
      - path: Blitz/Resources/EmojiKeywords
        type: folder
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    dependencies:
      - target: ClipboardTextHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.blitz
        INFOPLIST_FILE: Blitz/Info.plist
        CODE_SIGN_ENTITLEMENTS: Blitz/Blitz.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: blitz
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel: a distinct bundle id means a locally-run build gets its own
        # prefs, caches, TCC grants and login item instead of inheriting the installed app's state.
        Debug:
          PRODUCT_NAME: Blitz Dev
          PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.blitz.dev

  ClipboardTextHelper:
    type: tool
    platform: macOS
    sources:
      - Blitz/Features/Clipboard/Service/ClipboardTextExtractor.swift
      - Blitz/Features/Clipboard/Service/ClipboardTextHelper.swift
    settings:
      base:
        # Pinned so a PRODUCT_NAME override on the xcodebuild line, which hits every target, can't
        # rename the executable `ClipboardTextWorker` looks for or put a space in the module name.
        EXECUTABLE_NAME: ClipboardTextHelper
        PRODUCT_MODULE_NAME: ClipboardTextHelper
        SKIP_INSTALL: YES
