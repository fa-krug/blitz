name: Release

# Every push to main ships: a self-signed universal build, published as the GitHub Release the
# in-app updater reads. Not notarized — see docs/release.md.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      # The patch is the run number, so every push is strictly newer than the last and the updater
      # offers it. Bump MAJOR.MINOR in project.yml when a release deserves it.
      - name: Compute version
        id: meta
        run: |
          BASE="$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          VERSION="${BASE%.*}.${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_file=Blitz-Universal-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      # The same self-signed identity on every release is what keeps users' Accessibility grant
      # alive across updates, and what the updater checks before it installs. See docs/signing.md.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "${P12_BASE64}" ]; then
            echo "::error::SIGNING_P12_BASE64 is not set — see docs/signing.md."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      # One universal build serves every Mac: Intel takes it, and Apple silicon falls back to it.
      - name: Build app
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          xcodebuild -project Blitz.xcodeproj -scheme Blitz -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Blitz Self-Signed" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      # A thin helper inside a universal app boots on Intel and silently loses clipboard OCR.
      - name: Assert both slices on the shipping binaries
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Blitz.app"
          for BIN in "$APP/Contents/MacOS/Blitz" "$APP/Contents/Helpers/ClipboardTextHelper"; do
            SLICES="$(lipo -archs "$BIN")"
            for A in arm64 x86_64; do
              case " $SLICES " in
                *" $A "*) ;;
                *) echo "::error::${BIN##*/}: missing $A (got '$SLICES')"; exit 1 ;;
              esac
            done
          done

      - name: Assert the signature is sound
        run: ./Scripts/verify-signature.sh "$RUNNER_TEMP/DerivedData/Build/Products/Release/Blitz.app"

      # `ditto -c -k --keepParent --sequesterRsrc` is the only zip that leaves the code signature
      # verifiable; plain `zip` drops symlinks and the updater would refuse every update.
      - name: Package
        env:
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent --sequesterRsrc \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release/Blitz.app" "dist/${ZIP_FILE}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        run: |
          gh release create "v${VERSION}" "dist/${ZIP_FILE}" \
            --target "$GITHUB_SHA" \
            --title "Blitz ${VERSION}" \
            --generate-notes \
            --latest
